services:
  postgresdb:
    image: pgvector/pgvector:pg17
    container_name: postgresdb
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: LKS
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
  face-service:
    build:
      context: ./face-service

    container_name: face-service

    ports:
      - "5000:5000"

    environment:
      PYTHONUNBUFFERED: 1

    volumes:
      # The Dockerfile bakes app.py in with `COPY . .`, so without this mount a
      # code change only takes effect after `up -d --build`. That is how the
      # container ended up serving a build that predated /verify and answered
      # 404 while app.py clearly had the route.
      - ./face-service:/app
      # InsightFace downloads buffalo_l (~281 MB) into ~/.insightface on first
      # use. That lives in the container's writable layer, so every recreate
      # re-downloads the whole model. A named volume keeps it across rebuilds.
      - insightface_models:/root/.insightface

      # Scaling: set FACE_WORKERS in your shell or .env to roughly the number of
    # CPU cores for production — each worker is a separate process, which is the
    # safe way to parallelise onnxruntime on CPU (each one also holds ~1 GB of
    # models). The default (unset / 0) keeps the dev loop: a single --reload
    # worker that picks up app.py edits without a rebuild. For larger fleets,
    # scale the service instead: docker compose up -d --scale face-service=4
    # (see server/src/app/utils/pythonSidecar.ts for the client-side pool).
    command: ["sh", "-c", "if [ \"${FACE_WORKERS:-0}\" = \"0\" ]; then exec uvicorn app:app --host 0.0.0.0 --port 5000 --reload; else exec uvicorn app:app --host 0.0.0.0 --port 5000 --workers ${FACE_WORKERS:-0}; fi"]
    restart: unless-stopped

    depends_on:
      - postgresdb

volumes:
  postgres_data:
  insightface_models:
